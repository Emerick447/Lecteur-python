<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Injecteur de Script - Basthon</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 30px;
            text-align: center;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            margin: 0 auto;
        }
        .btn-basthon {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #2c3e50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            display: none; /* Caché au début */
        }
        .btn-basthon:hover {
            background-color: #34495e;
        }
        pre {
            text-align: left;
            background: #eee;
            padding: 10px;
            max-height: 150px;
            overflow-y: auto;
            font-size: 12px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>Etape 1 : Charger le fichier .py</h2>
    <input type="file" id="filePicker" accept=".py">

    <div id="previewSection" style="display:none; margin-top:20px;">
        <h3>Texte récupéré :</h3>
        <pre id="textOutput"></pre>
        
        <h2>Etape 2 : Envoyer à l'API Basthon</h2>
        <!-- Ce lien va appeler l'interface officielle de Basthon avec notre texte -->
        <a id="basthonLink" href="#" target="_blank" class="btn-basthon">Ouvrir dans Basthon Console</a>
    </div>
</div>

<script>
    document.getElementById('filePicker').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        // On crée le lecteur pour récupérer le fichier en mode TEXTE pur (.txt)
        const reader = new FileReader();

        reader.onload = function(e) {
            const pythonRawText = e.target.result; // C'est le texte brut de ton script

            // 1. Affichage du texte récupéré dans l'interface
            document.getElementById('textOutput').textContent = pythonRawText;
            document.getElementById('previewSection').style.display = 'block';

            /* 
               2. Injection dans l'API de Basthon.
               On utilise encodeURIComponent() pour que les sauts de ligne, 
               les espaces et les caractères spéciaux du script passent dans l'URL.
            */
            const basthonApiUrl = "https://basthon.fr" + encodeURIComponent(pythonRawText);
            
            // 3. Mise à jour du bouton d'action
            const linkButton = document.getElementById('basthonLink');
            linkButton.href = basthonApiUrl;
            linkButton.style.display = 'inline-block';
        };

        // On force la lecture du fichier .py sous forme de chaîne de texte
        reader.readAsText(file);
    });
</script>

</body>
</html>
